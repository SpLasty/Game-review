   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #53677a" transform="translate(77.164531 421.676516)">Retrieval searches eligible review spans for each claim; fix-check mode reverses retrieval to announcement</text>
