[collection]
storage_root = "data/relevance_v1"
report_root = "reports/relevance_v1/stage1"
news_since = "2024-01-01T00:00:00Z"
news_page_size = 20
max_news_pages_per_game = 60
max_pages_per_review_window = 10
max_requests = 1000
max_retries = 5
request_timeout_seconds = 30
min_request_interval_seconds = 0.5
backoff_base_seconds = 0.75
backoff_max_seconds = 30.0

[patch_selection]
max_patches_per_game = 7
minimum_body_characters = 120

[windows]
days_before = 14
days_after_early = 7
days_after_late = 7

[reviews]
# Steam documents an empty languages list as English-only; use "all" to collect every language.
languages = ["all"]

