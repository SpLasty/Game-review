[project]
root = ".."

[inputs]
data_config = "configs/data.toml"
raw_archive = "data/raw/steam_30_games"
recovery_dir = "data/raw/pipeline_recovery"
annotations = "data/annotations/labels.jsonl"
patch_verification = "data/annotations/patch_verification.jsonl"

[outputs]
datasets_dir = "data/datasets"
reports_dir = "reports/data_quality/pipeline"

[reviews]
minimum_words = 10
language = "english"
language_detection_min_words = 20
language_warning_probability = 0.90
passage_max_chars = 1200
near_duplicate_similarity = 0.92
near_duplicate_bucket_limit = 300

[windows]
days_before = 14
days_after = 14
minimum_reviews = 30
minimum_review_dates = 7
stronger_minimum_reviews = 100

[candidates]
feedback_days = 14
resolution_days = 90
minimum_shared_terms = 2
max_per_review_per_task = 5

[splits]
seed = 42
validation_games = 2
test_games = 20

[storage]
compression = "zstd"
compression_level = 3
row_group_size = 65536

[collection]
max_requests = 60
news_pages_per_game = 3
review_pages_per_window = 10
max_patch_windows = 10
request_interval_seconds = 1.5
timeout_seconds = 15
retry_count = 2

