[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-patch-relevance"
version = "0.1.0"
description = "Local-first Steam source collection for patch-grounded review research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "matplotlib>=3.8,<4",
    "duckdb>=1.2,<2",
    "beautifulsoup4>=4.12,<5",
    "langdetect>=1.0.9,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8,<9"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]
retrieval = ["sentence-transformers>=3.4,<6"]

[project.scripts]
steam-relevance = "steam_patch_relevance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/check_data_foundation.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
