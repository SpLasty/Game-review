[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-patch-insights"
version = "0.1.0"
description = "Data exploration and preprocessing for evidence-backed Steam patch analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[project.scripts]
steam-insights = "steam_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/test_data_*.py", "scripts/check_data_foundation.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
